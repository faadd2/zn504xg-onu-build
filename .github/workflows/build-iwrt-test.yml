name: "Build ImmortalWrt an7581 test (matrix: official-ported / naoki66)"

# ImmortalWrt 双基底测试编译：
# - official-ported：immortalwrt/immortalwrt 官方 master + 从 ponwrt 移植 an7581/ZN504XG-D 支持
# - naoki66：naoki66/ImmortalWrt-for-Gemtek-brightspeed 树 + 从 ponwrt 追加 zn504 设备支持
# 产物自动发布 Release（tag: iwrt-test-<run_number>），用于刷机对比后决定正式基底。

on:
  workflow_dispatch:
    inputs:
      immortalwrt_ref:
        description: immortalwrt/immortalwrt ref (official-ported 基底)
        required: true
        default: master
        type: string
      naoki66_ref:
        description: naoki66 tree ref (naoki66 基底)
        required: true
        default: master
        type: string
      ponwrt_ref:
        description: huladabang/ponwrt ref (ZN504 移植件来源)
        required: true
        default: master
        type: string
      onu_suite_ref:
        description: luci-app-onu suite ref (注入的自定义套件)
        required: true
        default: main
        type: string
      inject_onu_suite:
        description: 注入自定义 ONU 套件（8 个包）
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read

concurrency:
  group: build-iwrt-test-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [official-ported, naoki66]

    steps:
      - name: Checkout base tree (${{ matrix.variant }})
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.variant == 'official-ported' && 'immortalwrt/immortalwrt' || 'naoki66/ImmortalWrt-for-Gemtek-brightspeed' }}
          ref: ${{ matrix.variant == 'official-ported' && inputs.immortalwrt_ref || inputs.naoki66_ref }}
          path: iwrt

      - name: Checkout PonWrt (ZN504 port source)
        uses: actions/checkout@v6
        with:
          repository: huladabang/ponwrt
          ref: ${{ inputs.ponwrt_ref }}
          path: ponwrt-ref

      - name: Checkout build config (this repo)
        uses: actions/checkout@v6
        with:
          path: onu-build

      - name: Checkout ONU suite
        if: inputs.inject_onu_suite == 'yes'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.ONU_SUITE_REPO || format('{0}/luci-app-onu', github.repository_owner) }}
          ref: ${{ inputs.onu_suite_ref }}
          path: onu-suite

      # 官方 IWRT 没有 ZN504XG-D：整棵 airoha target + generic 内核补丁 + 启动固件包
      # + PON feeds 从 ponwrt 移植。generic 必须一起换：IWRT 的 generic/pending-6.18
      # 与 ponwrt 的 airoha 内核反向移植上下文不匹配（run 38488123957 的 671 号补丁
      # 3/3 hunk 全挂就是因此）。两树 KERNEL_PATCHVER 同为 6.18。
      - name: Port airoha target from ponwrt (official-ported only)
        if: matrix.variant == 'official-ported'
        run: |
          cd iwrt
          rm -rf target/linux/airoha target/linux/generic
          cp -r ../ponwrt-ref/target/linux/airoha target/linux/
          cp -r ../ponwrt-ref/target/linux/generic target/linux/
          cp -f ../ponwrt-ref/include/kernel-6.18* include/ 2>/dev/null || true
          mkdir -p package/boot package/firmware
          cp -r ../ponwrt-ref/package/boot/arm-trusted-firmware-airoha package/boot/
          cp -r ../ponwrt-ref/package/boot/uboot-airoha package/boot/
          cp -r ../ponwrt-ref/package/firmware/znxt-zn515-mt7916-eeprom package/firmware/ 2>/dev/null || true
          # 追加 PON 两个 feed（ponwrt 的 packages/luci feed 与 IWRT 官方同源，无需改动）
          grep -E '^(src-git|src-link) (pon_drivers|pon_userspace) ' ../ponwrt-ref/feeds.conf.default >> feeds.conf.default || true
          sort -u feeds.conf.default -o feeds.conf.default
          echo "===== kernel version of ported target ====="
          grep KERNEL_PATCHVER target/linux/airoha/Makefile || true
          echo "===== feeds ====="
          cat feeds.conf.default

      # naoki66 树已有 an7581 target 与自家 PON feeds：只追加 zn504 的 dts + 设备定义块。
      - name: Add ZN504XG-D device support (naoki66 only)
        if: matrix.variant == 'naoki66'
        run: |
          cd iwrt
          cp ../ponwrt-ref/target/linux/airoha/dts/an7581-znxt-zn504xg-d.dts \
             ../ponwrt-ref/target/linux/airoha/dts/an7581-znxt-zn50xg-d-common.dtsi \
             target/linux/airoha/dts/
          MK=target/linux/airoha/image/an7581.mk
          # 抽取 ponwrt 的 znxt 三个设备块（common + zn515 + zn504）整段追加
          awk '/^define Device\/znxt_zn50xg-d-common/{f=1} f{print} /^TARGET_DEVICES \+= znxt_zn504xg-d/{f=0}' \
             ../ponwrt-ref/target/linux/airoha/image/an7581.mk >> "$MK"
          # zn515 块引用的 USB 存储包变量：ponwrt 有定义而 naoki66 未必，补上
          if ! grep -q '^AIROHA_USB_STORAGE_PACKAGES' "$MK"; then
            grep '^AIROHA_USB_STORAGE_PACKAGES' ../ponwrt-ref/target/linux/airoha/image/an7581.mk >> "$MK" || true
          fi
          echo "===== znxt blocks in $MK ====="
          grep -n "znxt" "$MK" || echo "::error::znxt device blocks not appended!"
          echo "===== kernel version ====="
          grep KERNEL_PATCHVER target/linux/airoha/Makefile || true

      - name: Inject ONU suite packages
        if: inputs.inject_onu_suite == 'yes'
        run: |
          mkdir -p iwrt/package
          for p in onu-suite/luci-app-onu onu-suite/luci-app-onu-internet \
                   onu-suite/luci-app-onu-iptv onu-suite/luci-app-onu-voice \
                   onu-suite/luci-app-onu-mgmt onu-suite/luci-app-onu-migrate \
                   onu-suite/luci-app-speedcheck onu-suite/luci-app-netspeedtest \
                   onu-suite/luci-app-airoha-npu onu-suite/zn504xg-defaults; do
            cp -r "$p" iwrt/package/
          done
          ls iwrt/package/

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zip zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: iwrt/dl
          key: iwrt-dl-an7581-${{ matrix.variant }}-${{ hashFiles('iwrt/feeds.conf.default') }}
          restore-keys: |
            iwrt-dl-an7581-${{ matrix.variant }}-

      - name: Install feeds
        working-directory: iwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 与我们增强版冲突的 feed 包处理（两基底 feed 布局不同，分腿处理）：
      # - official-ported（ponwrt feeds）：pon_userspace 的上游原版 luci-app-pon 页面
      #   与增强版并存会出两个 PON 菜单，移除原版
      # - naoki66：onu_config feed 的原版 luci-app-onu 与改名后的增强版主包（f50a168
      #   起 PKG_NAME=luci-app-onu）同名，不移除会导致重名包冲突
      - name: Prefer enhanced suite over feed copies
        if: inputs.inject_onu_suite == 'yes'
        working-directory: iwrt
        run: |
          if [ "${{ matrix.variant }}" = "official-ported" ]; then
            rm -f package/feeds/pon_userspace/luci-app-pon
            ls package/feeds/pon_userspace/ | grep -i "luci-app-pon" || echo "no feed luci-app-pon left"
          else
            rm -f package/feeds/onu_config/luci-app-onu
            ls package/feeds/onu_config/ | grep -i "luci-app-onu" || echo "no feed luci-app-onu left"
          fi

      - name: Configure (${{ matrix.variant }})
        working-directory: iwrt
        run: |
          if [ "${{ matrix.variant }}" = "official-ported" ]; then
            ./scripts/kconfig.pl + \
              ../ponwrt-ref/configs/an7581.config \
              ../onu-build/config/onu-frag.config > .config
          else
            # OpenWrt 设备选择符号是 CONFIG_TARGET_<target>_<subtarget>_DEVICE_<name>
            # 设备符号前缀必须是 CONFIG_TARGET_airoha_an7581_DEVICE_...（不是
            # CONFIG_TARGET_DEVICE_...，第四跑 run 38517535582 实证后者会被
            # defconfig 静默丢弃，回退编译默认设备）。种子已选 gemtek_xg2010g-ubi，
            # 这里追加 zn504；用户 10-15 拍板双设备保留，不再关 gemtek。
            {
              echo 'CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y'
            } > /tmp/zn504.frag
            # naoki66 官方用法就是 cp 种子配置（kconfig.pl 两趟合并会吞掉设备符号，
            # run 38503535613 实证：defconfig 后 0 台设备）。cat 追加片段 + defconfig
            # 是 OpenWrt 社区固件的成熟做法，重复赋值后者生效。
            cp 2010.config .config
            cat /tmp/zn504.frag ../onu-build/config/onu-frag.config >> .config
          fi
          make defconfig
          echo "===== kernel version ====="
          grep -E 'CONFIG_LINUX_|KERNEL' .config | head -5 || true
          echo "===== resolved target devices ====="
          grep "^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y" .config || echo "::warning:: no devices selected!"
          if [ "${{ matrix.variant }}" = "naoki66" ]; then
            grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y" .config \
              || { echo "::error:: zn504 device not selected in .config"; exit 1; }
            grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xg2010g-ubi=y" .config \
              || { echo "::error:: xg2010g device not selected in .config"; exit 1; }
          fi
          echo "===== resolved custom packages ====="
          grep -E "^CONFIG_PACKAGE_(luci-app-pon|luci-app-onu[a-z-]*|luci-app-speedcheck|luci-app-netspeedtest|luci-app-airoha-npu|zn504xg-defaults)=" .config || echo "::warning:: custom packages missing!"

      - name: Download sources
        working-directory: iwrt
        run: make download -j"$(nproc)"

      # airoha-pond 双版本（补丁版=北京联通 10G EPON OAM 兼容，stock=原厂）
      # + 补丁开关脚本 + 开机自应用 + watchdog。files/ 整树合入 rootfs。
      # 作用与出处校验见 onu-build/files/README-pond.txt。
      - name: Overlay pond dual binaries + switch scripts into rootfs
        working-directory: iwrt
        run: |
          mkdir -p files
          cp -r "../onu-build/files/." files/
          chmod 755 files/usr/sbin/airoha-pond files/usr/sbin/airoha-pond.patched files/usr/sbin/airoha-pond.stock files/usr/sbin/pond-patch-switch.sh files/usr/sbin/pond-watchdog.sh files/etc/init.d/pond-patch files/etc/uci-defaults/99-pond-setup
          md5sum files/usr/sbin/airoha-pond files/usr/sbin/airoha-pond.patched files/usr/sbin/airoha-pond.stock
          [ "$(md5sum files/usr/sbin/airoha-pond.patched | awk '{print $1}')" = "0ee93a7a240c04bf248a2cdaca0f447c" ] || { echo "::error::patched pond checksum mismatch!"; exit 1; }
          [ "$(md5sum files/usr/sbin/airoha-pond.stock | awk '{print $1}')" = "9abf8905eb5aa1446974999092650239" ] || { echo "::error::stock pond checksum mismatch!"; exit 1; }

      - name: Build ${{ matrix.variant }}
        working-directory: iwrt
        run: |
          make -j"$(nproc)" || {
            echo "::warning::parallel build failed — retrying single-threaded V=s to surface the real error"
            make -j1 V=s
          }

      - name: Inspect image output dir
        working-directory: iwrt
        run: |
          echo "===== bin/targets/airoha/an7581 listing ====="
          ls -lah bin/targets/airoha/an7581/ 2>/dev/null || echo "(dir missing!)"
          echo "===== all images in tree ====="
          find bin/targets -maxdepth 3 \( -name "*.itb" -o -name "*.bin" -o -name "*.img" -o -name "*.gz" \) 2>/dev/null | head -40

      - name: Pack firmware images
        run: |
          mkdir -p release
          cd iwrt/bin/targets/airoha/an7581
          ls -lah
          shopt -s nullglob
          files=( *.bin *.itb sha256sums *.manifest profiles.json )
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware images produced — refusing to pack an empty release"
            exit 1
          fi
          echo "packing: ${files[*]}"
          tar --zstd -cf "$GITHUB_WORKSPACE/release/iwrt-an7581-${{ matrix.variant }}-images.tar.zst" "${files[@]}"
          # zip 版：Windows 资源管理器可直接打开（用户要求的双格式发布）
          zip -q "$GITHUB_WORKSPACE/release/iwrt-an7581-${{ matrix.variant }}-images.zip" "${files[@]}"
          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: Pack packages feed
        if: always()
        run: |
          cd iwrt/bin/targets/airoha/an7581
          if [ -d packages ]; then
            tar --zstd -cf "$GITHUB_WORKSPACE/release/iwrt-an7581-${{ matrix.variant }}-packages.tar.zst" packages
            zip -qr "$GITHUB_WORKSPACE/release/iwrt-an7581-${{ matrix.variant }}-packages.zip" packages
            ls -lh "$GITHUB_WORKSPACE/release/"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iwrt-an7581-${{ matrix.variant }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iwrt-an7581-*-${{ github.run_number }}
          path: assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iwrt-test-${{ github.run_number }}
          name: "ImmortalWrt an7581 test build ${{ github.run_number }}"
          body: |
            ImmortalWrt 双基底测试固件（用户对比用，非正式版）：

            - `iwrt-an7581-official-ported-images.tar.zst`：immortalwrt/immortalwrt 官方 + ponwrt 移植 an7581/ZN504XG-D
            - `iwrt-an7581-naoki66-images.tar.zst`：naoki66 树 + ponwrt 追加 zn504 设备支持

            基底引用：official=${{ github.event.inputs.immortalwrt_ref }}，naoki66=${{ github.event.inputs.naoki66_ref }}，ponwrt=${{ github.event.inputs.ponwrt_ref }}，suite=${{ github.event.inputs.onu_suite_ref }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: assets/*
