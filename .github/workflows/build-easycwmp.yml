name: "Build easycwmp packages (TR-069 备用客户端，不进固件)"

# 只编译 easycwmp + libmicroxml 两个 apk（连同依赖），产物发 Release 存档，
# 供 504 实机 opkg/apk 安装。数据模型 shell 脚本适配（functions/ 占位数据）
# 由会话 A 后续处理，本工作流只保证编出可装的包。

on:
  workflow_dispatch:
    inputs:
      ponwrt_ref:
        description: huladabang/ponwrt ref (编译基底)
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: build-easycwmp-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build easycwmp apk
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v6
        with:
          repository: huladabang/ponwrt
          ref: ${{ inputs.ponwrt_ref }}
          path: ponwrt

      - name: Checkout build config (this repo)
        uses: actions/checkout@v6
        with:
          path: onu-build

      - name: Inject easycwmp feed
        run: |
          mkdir -p ponwrt/package
          cp -r onu-build/feed-easycwmp/easycwmp onu-build/feed-easycwmp/libmicroxml ponwrt/package/
          ls ponwrt/package/

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkg-config pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install feeds (按需)
        working-directory: ponwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install libubox libubus uci json-c curl libcurl

      - name: Configure (zn504 目标 + easycwmp)
        working-directory: ponwrt
        run: |
          {
            echo 'CONFIG_TARGET_airoha=y'
            echo 'CONFIG_TARGET_airoha_an7581=y'
            echo 'CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y'
            echo 'CONFIG_PACKAGE_easycwmp=y'
          } > .config
          make defconfig
          echo "===== resolved device ====="
          grep "^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y" .config || { echo "::error:: device not selected"; exit 1; }
          echo "===== resolved packages ====="
          grep -E "^CONFIG_PACKAGE_(easycwmp|libmicroxml)=" .config || echo "::warning:: custom packages missing"

      # run 38539215092 实证：直接 `make package/x/compile` 时 tools/libdeflate 尚未
      # 安装，host 包 lua 的 prepare 步骤调用 staging_dir/host/bin/libdeflate-gzip
      # 即报 No such file（并行竞态 + 单线程重试同样复现）。
      # run 38550724878 实证：下一层同样的问题——交叉工具链未装完就进
      # package/libs/toolchain，libgcc_s.so.* 尚不存在即 stat 失败。
      # 标准三段式：tools/install -> toolchain/install -> package/compile。
      - name: Build host tools
        working-directory: ponwrt
        run: make tools/install -j"$(nproc)"

      - name: Build cross toolchain
        working-directory: ponwrt
        run: make toolchain/install -j"$(nproc)"

      - name: Build packages
        working-directory: ponwrt
        run: |
          make package/easycwmp/compile -j"$(nproc)" || {
            echo "::warning::parallel build failed — retrying single-threaded V=s"
            make package/easycwmp/compile -j1 V=s
          }

      - name: Verify artifacts
        working-directory: ponwrt
        run: |
          echo "===== built easycwmp/microxml packages ====="
          find bin/packages \( -name "*easycwmp*" -o -name "*microxml*" \) | sort
          find bin/packages \( -name "*easycwmp*" -o -name "*microxml*" \) | grep -q easycwmp || { echo "::error:: easycwmp apk not built"; exit 1; }
          find bin/packages \( -name "*easycwmp*" -o -name "*microxml*" \) | grep -q microxml || { echo "::error:: libmicroxml apk not built"; exit 1; }

      - name: Pack packages
        run: |
          mkdir -p release
          cd ponwrt
          find bin/packages \( -name "*easycwmp*" -o -name "*microxml*" \) -exec cp {} "$GITHUB_WORKSPACE/release/" \;
          cd "$GITHUB_WORKSPACE/release"
          sha256sum * > sha256sums
          ls -lah

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easycwmp-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: easycwmp-${{ github.run_number }}
          path: assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: easycwmp-${{ github.run_number }}
          name: "easycwmp 备用包 ${{ github.run_number }} (ponwrt ${{ github.event.inputs.ponwrt_ref || 'master' }})"
          body: |
            TR-069 备用客户端 easycwmp 1.8.6 + libmicroxml，an7581/zn504 目标编译。
            只含 apk 软件包，不含固件；安装： `apk add --allow-untrusted easycwmp-<ver>.apk`
            数据模型脚本（functions/）为上游占位实现，实机适配另行处理。
          files: assets/*
