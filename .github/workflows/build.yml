name: "Build PonWrt an7581 (matrix: ONU suite / stock)"

on:
  workflow_dispatch:
    inputs:
      ponwrt_ref:
        description: PonWrt ref (branch or commit SHA to pin)
        required: true
        default: master
        type: string
      onu_suite_ref:
        description: luci-app-onu suite ref
        required: true
        default: main
        type: string
      voice_kernel_patches:
        description: Inject kernel-patches/ (voice ASoc) — disabled by default, v6 series conflicts with upstream ponwrt 200-02 ASoC AFE/I2S driver
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      build_label:
        description: Firmware build label written to /etc/pon-build-tag (default dev-<suite sha>)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-an7581-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [onu-suite, stock]
        include:
          - variant: onu-suite
            frag: config/onu-frag.config
            inject_suite: "yes"
          - variant: stock
            frag: config/stock-frag.config
            inject_suite: "no"

    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v6
        with:
          repository: huladabang/ponwrt
          ref: ${{ inputs.ponwrt_ref }}
          path: ponwrt

      - name: Checkout build config (this repo)
        uses: actions/checkout@v6
        with:
          path: onu-build

      # ppp 固定 2.5.1：ponwrt 主线带 pppd 2.5.4，其 ip-up/ip-down 子进程在拨号成功时
      # 必崩（signal 11，A 侧 10-15 实机 A/B 确证：同 OLT 同协商，24.10 的 2.5.1 正常、
      # 2.5.4 必崩），导致 netifd 收不到 ppp-up 通知、接口持 IP 但协议态 down。
      # 最简修复（A 拍板）= 整体换用 openwrt-24.10 分支的 package/network/services/ppp
      # （24.10 即 2.5.1-r1，Makefile 补丁与版本配套）。只下载该目录，不动树其余部分。
      - name: Pin ppp to 2.5.1 (openwrt-24.10 package dir)
        run: |
          curl -fsSL -o /tmp/ow24.tar.gz https://codeload.github.com/openwrt/openwrt/tar.gz/refs/heads/openwrt-24.10
          # codeload 归档根目录名是 <repo>-<ref>（openwrt-openwrt-24.10），
          # 不能硬编码（11 秒挂实证），先探测再解包
          root=$(tar -tzf /tmp/ow24.tar.gz | head -1 | cut -d/ -f1)
          echo "archive root: $root"
          mkdir -p /tmp/ow24
          tar -xzf /tmp/ow24.tar.gz -C /tmp/ow24 --strip-components=4 \
            "$root/package/network/services/ppp"
          rm -rf ponwrt/package/network/services/ppp
          cp -r /tmp/ow24/ppp ponwrt/package/network/services/ppp
          grep -E "PKG_VERSION|PKG_RELEASE" ponwrt/package/network/services/ppp/Makefile | head -3

      - name: Checkout ONU suite
        if: matrix.inject_suite == 'yes'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.ONU_SUITE_REPO || format('{0}/luci-app-onu', github.repository_owner) }}
          ref: ${{ inputs.onu_suite_ref }}
          path: onu-suite

      - name: Inject ONU suite packages
        if: matrix.inject_suite == 'yes'
        run: |
          mkdir -p ponwrt/package
          for p in onu-suite/luci-app-onu onu-suite/luci-app-onu-internet \
                   onu-suite/luci-app-onu-iptv onu-suite/luci-app-onu-voice \
                   onu-suite/luci-app-onu-mgmt onu-suite/luci-app-onu-migrate \
                   onu-suite/luci-app-speedcheck onu-suite/luci-app-netspeedtest \
                   onu-suite/luci-app-airoha-npu onu-suite/zn504xg-defaults; do
            cp -r "$p" ponwrt/package/
          done
          # rpcd 后端可执行位兜底：onu-pond-patch 曾因 git 100644 进固件丢 +x
          # （build-21 实证）；git 层已修（3c421db），此处双保险
          chmod 755 ponwrt/package/luci-app-onu/root/usr/libexec/onu-pond-patch 2>/dev/null || true
          ls ponwrt/package/

      # 语音内核补丁（kernel-patches/ + dts-patches/，voice 会话维护）。
      # kernel-patches/ 进内核 series（201-* 排在上游 200-02 AFE/I2S 驱动之后）；
      # 注意：上下文若依赖排在后面的上游补丁（925/930 等），必须用大序号命名
      # （如 940-*，排在 ponwrt 930 之后），否则 quilt 中途应用必然 FAILED（build-25 实证）；
      # dts-patches/ 打到 OpenWrt 目标树（target dts 不进内核源码树，
      # 见 DEVICE_DTS_DIR := ../dts），必须分开应用。
      # 已于 6.18.55 真实源文件 + ponwrt master dtsi 上逐一 git apply 验证通过。
      - name: Inject kernel patches (voice / PPE)
        if: inputs.voice_kernel_patches == 'yes'
        run: |
          ls onu-build/kernel-patches/
          cp onu-build/kernel-patches/*.patch ponwrt/target/linux/airoha/patches-6.18/
          ls ponwrt/target/linux/airoha/patches-6.18/ | tail -10
          # Path A 的 SND_SOC config 注入已随 201-01..03 死补丁一并移除
          # （2026-10-17）；Path B 语音走 en75xx-voip feed 包，不经内核 config。

      - name: Apply dts patches (voice, target tree)
        if: inputs.voice_kernel_patches == 'yes'
        run: |
          ls onu-build/dts-patches/
          # git -C 会把相对补丁路径解析到 ponwrt/ 内（v7 因此 128 秒挂），必须用绝对路径
          git -C ponwrt apply --verbose "$GITHUB_WORKSPACE"/onu-build/dts-patches/*.patch

      # Path B 语音：en75xx-voip feed 包（lec/pcm/slic-le9642 三 kmod，
      # 包定义见 voice/openwrt/package/en75xx-voip/Makefile）。替换已死的
      # Path A（kmod-sound-soc-an7581 空壳包，201-01..03 死补丁移除后
      # 其 FILES 无源可编，留在注入清单会炸构建）。三个包选入 rootfs
      # （DEPENDS 链会自动带齐，这里显式写全便于 manifest 门禁核对）。
      - name: Inject en75xx-voip feed package (Path B voice)
        if: inputs.voice_kernel_patches == 'yes'
        run: |
          cp -r onu-build/voice/openwrt/package/en75xx-voip ponwrt/package/
          ls ponwrt/package/en75xx-voip/
          printf '%s\n' CONFIG_PACKAGE_kmod-en75xx-lec=y \
            CONFIG_PACKAGE_kmod-en75xx-pcm=y CONFIG_PACKAGE_kmod-en75xx-slic-le9642=y \
            >> onu-build/config/onu-frag.config
          tail -6 onu-build/config/onu-frag.config

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zip zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ matrix.variant }}-${{ inputs.ponwrt_ref }}-${{ hashFiles('ponwrt/feeds.conf.default') }}
          restore-keys: |
            ponwrt-dl-an7581-${{ matrix.variant }}-
            ponwrt-dl-an7581-

      - name: Install feeds
        working-directory: ponwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # telephony feed 的 baresip 自带 /etc/init.d/baresip（读 UCI baresip 段跑
      # /etc/baresip，与 onu.ims 架构不兼容=服务空转）；luci-app-onu-voice 自带
      # 定制 init 脚本，二者同路径冲突会在 rootfs 组装时报 apk overwrite ERROR
      # （build-7 实证）。剥掉 feed 的 init 安装行，让定制版成为唯一 init 脚本。
      - name: Strip stock baresip init.d (custom init ships with luci-app-onu-voice)
        if: matrix.inject_suite == 'yes'
        working-directory: ponwrt
        run: |
          f=feeds/telephony/net/baresip/Makefile
          [ -f "$f" ] || { echo "::error:: $f not found"; exit 1; }
          sed -i '/baresip\.init/d' "$f"
          if grep -q 'baresip\.init' "$f"; then echo "::error:: strip failed: baresip.init still referenced"; exit 1; fi
          grep -q 'Package/baresip' "$f" || { echo "::error:: $f sanity check failed (wrong file?)"; exit 1; }
          echo "stripped stock init.d from feed baresip"

      # 增强版 fork（package/luci-app-onu，PKG_NAME=luci-app-pon）与 pon_userspace feed
      # 的 luci-app-pon 同名；feed 后扫描会覆盖 package/ 下的定义，导致增强版被静默忽略。
      # 移除 feed 符号链接，让增强版成为唯一定义（仅 onu-suite 变体）。
      - name: Prefer enhanced luci-app-pon over feed copy
        if: matrix.inject_suite == 'yes'
        working-directory: ponwrt
        run: |
          rm -f package/feeds/pon_userspace/luci-app-pon
          ls package/feeds/pon_userspace/ | grep -i "pon\|onu" || true

      - name: Configure (official an7581.config + ${{ matrix.variant }} fragment)
        working-directory: ponwrt
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            "../onu-build/${{ matrix.frag }}" > .config
          make defconfig
          # 多设备模式下 profile 层（CONFIG_TARGET_..._DEVICE_*）一台都不该选——
          # 它们是 choice 成员，选了会挤掉 MULTI_PROFILE（build-17 实证）；
          # 真正的设备清单看 per-device 层（CONFIG_TARGET_DEVICE_...）
          echo "===== resolved multi-profile mode ====="
          grep "^CONFIG_TARGET_MULTI_PROFILE=y" .config || { echo "::error:: MULTI_PROFILE lost!"; exit 1; }
          if grep "^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y" .config; then echo "::error:: profile-layer device selected, MULTI_PROFILE will be lost!"; exit 1; fi
          echo "===== resolved per-device rootfs (this is the real device list) ====="
          grep "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config
          grep "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn504xg-d=y" .config || { echo "::error:: zn504 per-device missing!"; exit 1; }
          grep "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g=y" .config || { echo "::error:: xg2010g per-device missing!"; exit 1; }
          [ "$(grep -c "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config)" -le 2 ] || { echo "::error:: more than 2 devices selected!"; exit 1; }
          echo "===== resolved custom packages ====="
          grep -E "^CONFIG_PACKAGE_(luci-app-pon|luci-app-onu|luci-app-speedcheck|luci-app-netspeedtest|luci-app-airoha-npu|zn504xg-defaults|curl)=" .config || echo "WARNING: custom packages missing!"

      - name: Download sources
        working-directory: ponwrt
        run: make download -j"$(nproc)"

      # 固件版本标记（10-17 A+B 方案，用户批准）：标记随 files/ 叠加层进 squashfs，
      # 只信 /rom 本体永不过期（写 UCI config/openwrt_release 会被刷机配置保留机制
      # 弄成过期标记——方案论证见 SESSION-SYNC）。A 侧配套：init 开机把 /rom 的标记
      # 复制到 /etc 供 LuCI 状态页显示；验收单首项 cat /etc/pon-build-tag。
      - name: Write firmware build tag
        run: |
          label="${{ inputs.build_label }}"
          [ -n "$label" ] || label="dev-$(git -C onu-build rev-parse --short HEAD)"
          suite_sha=$(git -C onu-build rev-parse --short HEAD)
          ponwrt_rev=$(git -C ponwrt rev-parse --short HEAD)
          build_date=$(date -u +%Y-%m-%d)
          mkdir -p onu-build/files/etc
          printf '%s · %s · ponwrt %s · %s\n' "$label" "$suite_sha" "$ponwrt_rev" "$build_date" > onu-build/files/etc/pon-build-tag
          echo "pon-build-tag: $(cat onu-build/files/etc/pon-build-tag)"

      # airoha-pond 双版本（补丁版=北京联通 10G EPON OAM 兼容，stock=原厂）
      # + 补丁开关脚本 + 开机自应用 + watchdog。files/ 整树合入 rootfs。
      # 补丁作用与出处校验见 onu-build/files/README-pond.txt。
      - name: Overlay pond dual binaries + switch scripts into rootfs
        working-directory: ponwrt
        run: |
          mkdir -p files
          cp -r "../onu-build/files/." files/
          chmod 755 files/usr/sbin/airoha-pond files/usr/sbin/airoha-pond.patched files/usr/sbin/airoha-pond.stock files/usr/sbin/pond-patch-switch.sh files/usr/sbin/pond-watchdog.sh files/etc/init.d/pond-patch files/etc/uci-defaults/99-pond-setup
          echo "::group::pond overlay checksums"
          md5sum files/usr/sbin/airoha-pond files/usr/sbin/airoha-pond.patched files/usr/sbin/airoha-pond.stock
          echo "::endgroup::"
          [ "$(md5sum files/usr/sbin/airoha-pond.patched | awk '{print $1}')" = "0ee93a7a240c04bf248a2cdaca0f447c" ] || { echo "::error::patched pond checksum mismatch!"; exit 1; }
          [ "$(md5sum files/usr/sbin/airoha-pond.stock | awk '{print $1}')" = "9abf8905eb5aa1446974999092650239" ] || { echo "::error::stock pond checksum mismatch!"; exit 1; }

      - name: Build ${{ matrix.variant }}
        working-directory: ponwrt
        # 并行构建失败时回退单线程 V=s 重跑：增量编译只重做错过的部分，
        # 用于把并行输出里被吞掉的真正报错打印出来（run 38427745777 的
        # package/install 静默失败就是靠这种手段定位的）。
        run: |
          make -j"$(nproc)" || {
            echo "::warning::parallel build failed — retrying single-threaded V=s to surface the real error"
            make -j1 V=s
          }

      - name: Verify custom packages in final config
        if: matrix.inject_suite == 'yes'
        working-directory: ponwrt
        run: |
          echo "===== final .config custom package symbols ====="
          grep -E "^CONFIG_PACKAGE_(luci-app-pon|luci-app-onu[a-z-]*|luci-app-speedcheck|luci-app-netspeedtest|luci-app-airoha-npu|zn504xg-defaults)=" .config || echo "::error::custom packages missing from final .config!"
          echo "===== built package files ====="
          find bin/targets/airoha/an7581/packages -maxdepth 1 \( -name "luci-app-*.ipk" -o -name "luci-app-*.apk" -o -name "zn504xg-defaults*.ipk" -o -name "zn504xg-defaults*.apk" \) 2>/dev/null | sort || true

      - name: Inspect image output dir
        working-directory: ponwrt
        run: |
          echo "===== bin/targets/airoha/an7581 listing ====="
          ls -lah bin/targets/airoha/an7581/ 2>/dev/null || echo "(dir missing!)"
          echo "===== all images in tree ====="
          find bin/targets -maxdepth 3 \( -name "*.itb" -o -name "*.bin" -o -name "*.img" -o -name "*.gz" \) 2>/dev/null | head -40

      # manifest 硬门禁（A 10-16 要求）：教训=缺包只在刷机后才暴露，必须在打包前拦。
      # EN8811H 驱动+固件=两腿都要（2.5G 口）；migrate=仅 onu-suite 腿；ppp 版本防回退；
      # openssh-sftp-server=两腿都要（sftp 传固件/抓包，A 10-17 要求）；
      # 语音 kmod 三件套=voice=yes 且 onu-suite 腿必查（stock 腿纯净无语音，
      # 10-18 方案A 起腿级条件，曾 run 级误伤 stock 致 build-3 挂门禁）。
      - name: Manifest hard gate
        working-directory: ponwrt/bin/targets/airoha/an7581
        run: |
          mans=( *.manifest )
          [ ${#mans[@]} -gt 0 ] || { echo "::error::no manifest files!"; exit 1; }
          for pkg in kmod-phy-airoha-en8811h airoha-en8811h-firmware openssh-sftp-server; do
            grep -h "^$pkg - " "${mans[@]}" | sort -u || true
            grep -hq "^$pkg - " "${mans[@]}" || { echo "::error:: $pkg missing from manifest!"; exit 1; }
          done
          grep -hq "^ppp - 2\.5\.1" "${mans[@]}" || { echo "::error:: ppp is not 2.5.1!"; exit 1; }
          if [ "${{ matrix.inject_suite }}" = "yes" ]; then
            grep -hq "^luci-app-onu-migrate - " "${mans[@]}" || { echo "::error:: luci-app-onu-migrate missing from manifest!"; exit 1; }
          fi
          # 语音 kmod 三件套=voice=yes 且 onu-suite 腿才查（10-18 方案A：
          # 三包只被选入 onu-frag，stock 纯净腿没有也永不会有，run 级
          # 条件误伤 stock 腿致 build-3 三度挂门禁——stock=纯净对比基线
          # 是用户既定范围，语音能力归 onu-suite 腿）。
          if [ "${{ inputs.voice_kernel_patches }}" = "yes" ] && [ "${{ matrix.inject_suite }}" = "yes" ]; then
            for pkg in kmod-en75xx-lec kmod-en75xx-pcm kmod-en75xx-slic-le9642; do
              grep -h "^$pkg - " "${mans[@]}" | sort -u || true
              grep -hq "^$pkg - " "${mans[@]}" || { echo "::error:: voice build missing $pkg from manifest!"; exit 1; }
            done
          fi
          echo "manifest gate OK: ${mans[*]}"

      # if: always()（A 10-17 20:45 设计、用户批准）：门禁拦红后固件仍打包留存，
      # 治本 build-2 式"编译成功却零留存"；空目录拒绝保护仍在，Release 由
      # release job 的 needs.build.result == 'success' 把守，不合格固件不进 Release
      - name: Pack firmware images
        if: always()
        run: |
          mkdir -p release
          # 固件镜像资产：factory/sysupgrade/itb + 校验和（对标各固件项目 release）
          cd ponwrt/bin/targets/airoha/an7581
          ls -lah
          shopt -s nullglob
          files=( *.bin *.itb sha256sums *.manifest profiles.json )
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware images produced — refusing to pack an empty release"
            exit 1
          fi
          echo "packing: ${files[*]}"
          tar --zstd -cf "$GITHUB_WORKSPACE/release/ponwrt-an7581-${{ matrix.variant }}-images.tar.zst" "${files[@]}"
          # zip 版：Windows 资源管理器可直接打开（用户要求的双格式发布）
          zip -q "$GITHUB_WORKSPACE/release/ponwrt-an7581-${{ matrix.variant }}-images.zip" "${files[@]}"
          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: Pack packages feed
        if: always()
        run: |
          # 软件包仓库资产（可选，存在才打）
          cd ponwrt/bin/targets/airoha/an7581
          if [ -d packages ]; then
            tar --zstd -cf "$GITHUB_WORKSPACE/release/ponwrt-an7581-${{ matrix.variant }}-packages.tar.zst" packages
            zip -qr "$GITHUB_WORKSPACE/release/ponwrt-an7581-${{ matrix.variant }}-packages.zip" packages
            ls -lh "$GITHUB_WORKSPACE/release/"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-${{ matrix.variant }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-an7581-*-${{ github.run_number }}
          path: assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "PonWrt an7581 build ${{ github.run_number }} (${{ github.event.inputs.ponwrt_ref || 'master' }})"
          generate_release_notes: true
          files: assets/*
