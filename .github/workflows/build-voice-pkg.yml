name: "Build en75xx-voip packages (Path B 语音 kmod，不进固件)"

# 只编译 en75xx-voip 三个 kmod（lec/pcm/slic-le9642）的 apk，产物只留 artifact
# 不建 Release（A 10-17 20:45 设计、用户批准）。用途=build-3 之后 feed 包/
# 驱动补丁（voice/airoha-voip/patches/001,002）迭代时快速验证，不必烧完整 3h。
#
# 与完整固件 workflow（build.yml）的差异：
# ① hash 快检步放在 kernel 编译前——feeds install + defconfig 后即可
#   `make package/en75xx-voip/download V=s`，PKG_MIRROR_HASH 占位符会在约
#   30 分钟内失败并打印期望哈希（完整编译要等 1h+ 才走到 download）；
# ② KernelPackage 必须出内核树（vermagic），所以 kernel 编译省不掉，
#   省的是 rootfs/镜像/打包段（A 估算一轮 60~90 分钟）；
# ③ 不注入 kernel-patches/（940/941 与 PPE 诊断相关，本模块不依赖）也不打
#   dts-patches/（target dts 不影响模块编译）。

on:
  workflow_dispatch:
    inputs:
      ponwrt_ref:
        description: huladabang/ponwrt ref (编译基底)
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: build-voice-pkg-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build en75xx-voip apk
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v6
        with:
          repository: huladabang/ponwrt
          ref: ${{ inputs.ponwrt_ref }}
          path: ponwrt

      - name: Checkout build config (this repo)
        uses: actions/checkout@v6
        with:
          path: onu-build

      - name: Inject en75xx-voip feed package
        run: |
          mkdir -p ponwrt/package
          cp -r onu-build/voice/openwrt/package/en75xx-voip ponwrt/package/
          ls ponwrt/package/en75xx-voip/

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkg-config pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install feeds
        working-directory: ponwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a 2>/dev/null || true

      - name: Configure (zn504 目标 + en75xx-voip)
        working-directory: ponwrt
        run: |
          {
            echo 'CONFIG_TARGET_airoha=y'
            echo 'CONFIG_TARGET_airoha_an7581=y'
            echo 'CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y'
            echo 'CONFIG_PACKAGE_kmod-en75xx-lec=y'
            echo 'CONFIG_PACKAGE_kmod-en75xx-pcm=y'
            echo 'CONFIG_PACKAGE_kmod-en75xx-slic-le9642=y'
          } > .config
          make defconfig
          echo "===== resolved packages ====="
          grep -E "^CONFIG_PACKAGE_kmod-en75xx" .config || { echo "::error:: en75xx-voip packages missing from .config"; exit 1; }

      # hash 快检（A 设计核心）：PKG_MIRROR_HASH 占位/错误时在此步即失败并打印
      # 期望哈希（日志 grep "Expected\|PKG_MIRROR_HASH\|HASH"），不用等 kernel。
      # 本步失败=设计内行为：回填 voice/openwrt/package/en75xx-voip/Makefile 后重跑。
      - name: Hash check (make package/en75xx-voip/download)
        working-directory: ponwrt
        run: make package/en75xx-voip/download V=s

      # 单包竞态教训见 build-easycwmp.yml（run 38539215092/38550724878）：
      # 标准三段式 tools/install -> toolchain/install -> 目标编译。
      - name: Build host tools
        working-directory: ponwrt
        run: make tools/install -j"$(nproc)"

      - name: Build cross toolchain
        working-directory: ponwrt
        run: make toolchain/install -j"$(nproc)"

      # KernelPackage 依赖内核树（vermagic），kernel 编译不可省
      - name: Build kernel
        working-directory: ponwrt
        run: make target/linux/compile -j"$(nproc)"

      - name: Build en75xx-voip packages
        working-directory: ponwrt
        run: |
          make package/en75xx-voip/compile -j"$(nproc)" || {
            echo "::warning::parallel build failed — retrying single-threaded V=s"
            make package/en75xx-voip/compile -j1 V=s
          }

      - name: Verify artifacts
        working-directory: ponwrt
        run: |
          echo "===== built en75xx-voip packages ====="
          find bin/packages -name "*en75xx*" | sort
          for k in lec pcm slic-le9642; do
            find bin/packages -name "*en75xx-$k*" | grep -q . || { echo "::error:: kmod-en75xx-$k apk not built"; exit 1; }
          done

      - name: Pack packages
        run: |
          mkdir -p release
          cd ponwrt
          find bin/packages -name "*en75xx*" -exec cp {} "$GITHUB_WORKSPACE/release/" \;
          cd "$GITHUB_WORKSPACE/release"
          sha256sum * > sha256sums
          ls -lah

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-pkg-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
